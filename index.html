<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll-Driven Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="headline">WELCOME ITZ FIZZ</h1>
        
        <!-- Impact Metrics / Statistics -->
        <div class="stats-container">
            <div class="stat-card">
                <h2>99%</h2>
                <p>Satisfaction</p>
            </div>
            <div class="stat-card">
                <h2>10M+</h2>
                <p>Active Users</p>
            </div>
            <div class="stat-card">
                <h2>24/7</h2>
                <p>Support</p>
            </div>
        </div>

        <!-- Main Visual Element (Sports Car) -->
        <div class="car-wrapper">
            <img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=800&auto=format&fit=crop" alt="Car Visual" class="car-image">
        </div>
    </section>

    <!-- Extra Space to Enable Smooth Scroll Animation -->
    <section class="scroll-space">
        <h2>Scroll Down To See Animation</h2>
    </section>

    <!-- GSAP & ScrollTrigger CDN Links -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
